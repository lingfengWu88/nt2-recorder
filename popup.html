<!doctype html><html lang="zh"><meta charset="utf-8"><title>NT2 录制</title>
<style>body{font:14px system-ui;width:350px;padding:16px;background:#f5f8f6;color:#16362c}h1{font-size:21px}label{display:block;margin:12px 0}input{box-sizing:border-box;width:100%;padding:8px;border:1px solid #b9cfc5;border-radius:6px;margin-top:4px}button{padding:10px;border:0;border-radius:7px;background:#16634d;color:white;cursor:pointer}#stop{background:#9c3939}p,small{line-height:1.6}#status{white-space:pre-wrap;background:white;padding:10px;border-radius:8px}button:disabled{opacity:.5}</style>
<h1>NT2 分题录制 · 试用版</h1>
<p>先进入一道题的播放页面，再打开此扩展。只录这个标签页及其声音，不录麦克风。</p>
<label>文件名前缀<input id="prefix" value="NT2_B2_Kort" maxlength="60"></label>
<label>起始编号<input id="start" type="number" min="1" max="99999" value="1"></label>
<label>本批题数（先录 1 题验证）<input id="count" type="number" min="1" max="20" value="1"></label>
<label>每题录制秒数（包含播放、准备和答题时间）<input id="seconds" type="number" min="10" max="600" value="90"></label>
<label>下一题按钮的完整文字（批量时必填）<input id="nextText" placeholder="按网页实际文字填写，不要猜"></label>
<label>播放按钮的完整文字（可选）<input id="playText" placeholder="空白：第一题自行点击，后续须自动播放"></label>
<small>批量模式按固定时长翻题，不识别音频结束。下一题开始时也会保留切换画面。先分题型录制；暂不支持需重复确认、整页跳转或跨域嵌套按钮。</small>
<p><button id="check">检查按钮（不点击）</button></p>
<p><button id="startBtn">开始录制</button> <button id="stop">停止并保存当前段</button></p>
<div id="status">准备就绪</div>
<p><small>视频保存到“下载/NT2-recordings/批次时间/”，格式 WebM，VLC 可播放。请保持电脑唤醒、题目标签页前台显示。</small></p>
<script src="popup.js"></script></html>
